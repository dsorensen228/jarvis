[project]
name = "jarvis-code-factory"
version = "0.1.0"
description = "Temporal-backed autonomous coding task service for the Jarvis workspace"
requires-python = "==3.13.5"
dependencies = [
    "fastapi==0.116.1",
    "nh3==0.3.7",
    "pymongo==4.14.1",
    "temporalio==1.17.0",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
code-factory = "code_factory.__main__:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.9",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_factory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
