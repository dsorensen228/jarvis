[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Always-connected Raspberry Pi voice and touchscreen runtime for Jarvis"
requires-python = "==3.13.5"
dependencies = [
  "aiohttp>=3.12,<4",
  "audioop-lts>=0.2.2,<0.3",
  "httpx>=0.28,<0.29",
  "numpy>=2.2,<3",
  "onnxruntime>=1.22,<2",
  "openwakeword==0.6.0",
  "pyusb>=1.3,<2",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "sounddevice>=0.5,<0.6",
  "webrtcvad-wheels==2.0.14",
  "websockets>=15,<16",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.14",
]

[project.scripts]
jarvis-voice = "jarvis_voice.__main__:main"
jarvis-voice-diagnose = "jarvis_voice.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
exclude-dependencies = [
  "ai-edge-litert",
  "speexdsp-ns",
  "tflite-runtime",
]
