[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-camera"
version = "0.1.0"
description = "Jarvis Raspberry Pi AI Camera device"
requires-python = "==3.13.5"
dependencies = [
  "aiohttp==3.10.11",
  "httpx==0.27.2",
  "Pillow==11.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.24.0",
  "ruff==0.9.10",
]

[project.scripts]
jarvis-camera = "jarvis_camera.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
